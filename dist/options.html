<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoMap の設定</title>
  <style>
    :root { font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Meiryo", sans-serif; color: #1f2328; }
    body { margin: 0; background: #f6f8fa; }
    main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .lead { color: #57606a; margin: 0 0 20px; }
    section { background: #fff; border: 1px solid #d0d7de; border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; }
    h2 { font-size: 15px; margin: 0 0 10px; }
    .row { display: grid; grid-template-columns: 200px 1fr; align-items: center; gap: 8px; padding: 4px 0; }
    .row label { color: #424a53; }
    .color { display: flex; gap: 6px; align-items: center; }
    .color input[type=color] { width: 36px; height: 28px; padding: 0; border: 1px solid #d0d7de; border-radius: 6px; background: none; }
    input[type=text], input[type=number] { font: inherit; padding: 4px 8px; border: 1px solid #d0d7de; border-radius: 6px; width: 220px; }
    input[type=number] { width: 100px; }
    input.wide { width: 100%; box-sizing: border-box; }
    section .actions { margin-top: 8px; flex-wrap: wrap; }
    .services fieldset { border: 1px solid #d0d7de; border-radius: 8px; margin: 10px 0; padding: 6px 12px 10px; }
    .services legend { color: #57606a; padding: 0 4px; }
    .services .status { color: #57606a; }
    .preview { display: flex; gap: 12px; flex-wrap: wrap; }
    .preview canvas { border: 1px solid #d0d7de; border-radius: 8px; max-width: 100%; }
    .actions { display: flex; gap: 8px; align-items: center; }
    button { font: inherit; padding: 6px 14px; border-radius: 8px; border: 1px solid #d0d7de; background: #fff; cursor: pointer; }
    button.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
    #saved { color: #1a7f37; }
    @media (max-width: 560px) { .row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>AutoMap の設定</h1>
    <p class="lead">既定値は拡張機能内の <code>config.json</code> です。ここで変更した値はそれに上書きして保存されます。</p>
    <form id="form"></form>
    <section>
      <h2>プレビュー</h2>
      <div class="preview"><canvas id="pv1"></canvas><canvas id="pv2"></canvas></div>
    </section>
    <div class="actions">
      <button class="primary" id="save" type="button">保存</button>
      <button id="reset" type="button">既定値に戻す</button>
      <span id="saved"></span>
    </div>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
