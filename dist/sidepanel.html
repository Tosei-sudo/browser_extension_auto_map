<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoMap</title>
  <style>
    :root { font: 13px/1.45 system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Meiryo", sans-serif; color: #1f2328; }
    body { margin: 0; background: #f6f8fa; }
    header { position: sticky; top: 0; z-index: 1; background: #fff; border-bottom: 1px solid #d0d7de; padding: 10px 12px 8px; }
    .page { color: #57606a; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .summary { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 4px; }
    .count { font-size: 15px; font-weight: 600; }
    button { font: inherit; border-radius: 8px; border: 1px solid #d0d7de; background: #fff; cursor: pointer; padding: 5px 10px; }
    button:hover:not(:disabled) { background: #f3f4f6; }
    button:disabled { opacity: .5; cursor: default; }
    button.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
    button.primary:hover:not(:disabled) { background: #1a5fd0; }
    .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .chip { padding: 2px 9px; border-radius: 999px; font-size: 12px; }
    .chip[aria-pressed="true"] { background: #1f2328; border-color: #1f2328; color: #fff; }
    ul { list-style: none; margin: 0; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
    li { background: #fff; border: 1px solid #d0d7de; border-radius: 8px; padding: 8px 10px; display: grid; grid-template-columns: 1fr auto;
         gap: 2px 8px; cursor: pointer; }
    li:hover { border-color: #8c959f; }
    li.selected { border-color: #E53935; box-shadow: 0 0 0 1px #E53935; }
    .kind { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 4px; background: #eaeef2; color: #424a53; margin-right: 6px; }
    .text { font-weight: 600; word-break: break-all; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .sub { grid-column: 1; color: #57606a; font-size: 12px; font-variant-numeric: tabular-nums; word-break: break-all; }
    .actions { grid-row: 1 / span 3; grid-column: 2; align-self: center; display: flex; flex-direction: column; gap: 4px; }
    .map-btn, .viewer-btn { padding: 3px 8px; font-size: 12px; text-align: center; }
    .viewer-btn { border-radius: 8px; border: 1px solid #d0d7de; background: #fff; color: #0969da; text-decoration: none; }
    .viewer-btn:hover { background: #f3f4f6; }
    .empty { color: #57606a; padding: 24px 16px; text-align: center; }
  </style>
</head>
<body>
  <header>
    <div class="page" id="page"></div>
    <div class="summary">
      <span class="count" id="count">読み込み中…</span>
      <button class="primary" id="showAll" disabled>すべて地図で表示</button>
    </div>
    <div class="filters" id="filters"></div>
  </header>
  <ul id="list"></ul>
  <div class="empty" id="empty" hidden></div>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
